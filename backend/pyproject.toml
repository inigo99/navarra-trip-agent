[project]
name = "navarra-trip"
version = "0.1.0"
description = "Agente que planifica escapadas por Navarra con los datos abiertos del Gobierno de Navarra"
requires-python = ">=3.12"
license = "MIT"
# Solo lo que necesita la API: es lo que Vercel instala en la función (máx. 500 MB, o 5 GB con
# las funciones grandes). Ingesta, MCP y Claude van en el grupo dev.
dependencies = [
    "duckdb>=1.5.6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "numpy>=2",
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
    "langchain>=1.4.3",
    "langchain-groq>=0.3",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.12",
]

[project.scripts]
navarra-descargar = "navarra_trip.ingest.ckan:main"
navarra-normalizar = "navarra_trip.ingest.normaliza:main"
navarra-mapa = "navarra_trip.ingest.mapa:main"
navarra-indexar = "navarra_trip.tools.semantica:main"
navarra-tiempos = "navarra_trip.tools.rutas:main"
navarra-mcp = "navarra_trip.mcp_server:main"
navarra-plan = "navarra_trip.agente:main"
navarra-eval = "navarra_trip.evaluacion:main"
navarra-api = "navarra_trip.api:main"
navarra-demo = "navarra_trip.demo:main"

[project.optional-dependencies]
# ya no hace falta (la búsqueda semántica va en ONNX, sin torch); se deja para no romper
# configuraciones como la del servidor MCP en Claude Desktop que lo pasan
semantica = []

# dev: lo que se usa en local además de la API (tests, ingesta, servidor MCP, Claude). uv lo
# instala por defecto; Vercel no (sync --no-dev), y así la función no pasa de 500 MB.
[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3",
    "fastmcp>=4.0.10",
    "langchain-anthropic>=1.7.5",
    "pyproj>=3.8.0",
    "shapely>=2.1.2",
]

# Vercel: app.py es la entrada (FastAPI) y el build descarga el modelo ONNX a data/modelos
[tool.vercel.scripts]
build = "python vercel_build.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/navarra_trip"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
