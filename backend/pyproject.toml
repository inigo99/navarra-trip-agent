[project]
name = "navarra-trip"
version = "0.1.0"
description = "Agente que planifica escapadas por Navarra con los datos abiertos del Gobierno de Navarra"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "duckdb>=1.5.6",
    "fastmcp>=4.0.10",
    "httpx>=0.27",
    "lancedb>=0.39.0",
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.5",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.12",
    "pyproj>=3.8.0",
    "shapely>=2.1.2",
]

[project.scripts]
navarra-descargar = "navarra_trip.ingest.ckan:main"
navarra-normalizar = "navarra_trip.ingest.normaliza:main"
navarra-mapa = "navarra_trip.ingest.mapa:main"
navarra-indexar = "navarra_trip.tools.semantica:main"
navarra-mcp = "navarra_trip.mcp_server:main"
navarra-plan = "navarra_trip.agente:main"
navarra-eval = "navarra_trip.evaluacion:main"

[project.optional-dependencies]
semantica = [
    "sentence-transformers>=3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/navarra_trip"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
