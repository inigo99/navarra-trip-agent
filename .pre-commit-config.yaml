repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        # datos que necesita la API en Vercel (infra/vercel/README.md); ~16 MB en total
        exclude: ^backend/data/(navarra\.duckdb|tiempos\.npz|indice_.*\.npz)$
